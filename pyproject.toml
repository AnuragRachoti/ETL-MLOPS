[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "A machine learning operations (MLOps) pipeline project."
readme = "README.md"
authors = [
    { name = "anuragrachoti", email = "anuragrachoti@gmail.com" }
]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
