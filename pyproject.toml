[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anuragrachoti", email = "anuragrachoti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
mlops-pipeline = "mlops_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
